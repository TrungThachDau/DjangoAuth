services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - default
  frontend:
    build:
      context: ./auth-react-app
      dockerfile: Dockerfile
    networks:
      - default
    ports:
      - "5173:5173"
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - default
networks:
  default:
    driver: bridge