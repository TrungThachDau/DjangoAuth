services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - default
  frontend:
    build:
      context: /auth-react-app
    ports:
      - "5173:5173"
    volumes:
      - .:/fe/app
      - /fe/app/node_modules
    networks:
      - default
  frontend2:
    build:
      context: /auth-react-app-2
    ports:
      - "5174:5174"
    volumes:
      - .:/fe2/app
      - /fe2/app/node_modules
    networks:
      - default  
  nginx:
    build:
      context: /nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - default
networks:
    default:
        driver: bridge