version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    networks:
      - default

  frontend:
    build:
      context: ./auth-react-app
    environment:
      - PORT=5173
    volumes:
      - ./auth-react-app:/fe/app
      - /fe/app/node_modules
    networks:
      - default
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - default
    depends_on:
      - frontend
      - backend

networks:
  default:
    driver: bridge
