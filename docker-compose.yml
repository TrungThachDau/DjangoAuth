services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - default
  frontend:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
    networks:
      - default
    ports:
      - "3000:3000"
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - default
networks:
  default:
    driver: bridge